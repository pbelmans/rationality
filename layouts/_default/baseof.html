<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rationality results and methods for hypersurfaces.">
  <title>{{ if .IsHome }}Rationality of hypersurfaces{{ else }}{{ .Title }} | rationality.info{{ end }}</title>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark p-0" id="menu">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link py-2" href="{{ "/" | relURL }}">home</a></li>
        <li class="nav-item"><a class="nav-link py-2" href="{{ "/about/" | relURL }}">about</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link py-2" href="https://mgnbar.info">mgnbar.info</a></li>
        <li class="nav-item d-none d-sm-block"><a class="nav-link py-2" href="https://fanography.info">fanography.info</a></li>
      </ul>
    </div>
  </nav>
  <div id="title" class="border-bottom text-center py-2">
    <h1 class="mb-0"><a href="{{ "/" | relURL }}">\(X_d^n\subset\mathbb{P}^{n+1}\)</a></h1>
    <p id="slogan" class="mb-1">rationality of smooth hypersurfaces</p>
  </div>
  <main class="container py-3">
    {{ block "main" . }}{{ end }}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhJ8tQhY5jLxvN6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
